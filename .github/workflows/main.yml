name: Kali Linux via tmate

on: workflow_dispatch

jobs:
  kali-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Install Kali in Docker (No SSH keys needed)
        run: |
          echo "🚀 Setting up Kali Linux environment..."
          
          # Pull Kali image
          docker pull kalilinux/kali-rolling
          
          # Create a persistent Kali container
          docker run -d \
            --name kali-runner \
            --hostname kali-gha \
            -v /tmp/kali-data:/root \
            kalilinux/kali-rolling \
            sleep infinity
          
          echo "✅ Kali container created"
          
          # Install essential tools
          docker exec kali-runner apt-get update
          docker exec kali-runner apt-get install -y \
            curl wget git vim nano \
            net-tools iputils-ping dnsutils \
            nmap netcat-traditional socat \
            python3 python3-pip \
            jq htop neofetch \
            openssh-client

      - name: Install tmate (Direct installation)
        run: |
          echo "📦 Installing tmate..."
          
          # Install tmate from official repo
          wget -q https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz
          tar -xf tmate-2.4.0-static-linux-amd64.tar.xz
          sudo mv tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/
          
          echo "✅ tmate installed"

      - name: Generate tmate session
        run: |
          echo "🔗 Generating tmate session..."
          
          # Generate SSH key for tmate (no GitHub keys needed)
          mkdir -p ~/.tmate
          ssh-keygen -t rsa -f ~/.tmate/ssh_key -q -N ""
          
          # Start tmate session
          tmate -S ~/.tmate.sock new-session -d
          tmate -S ~/.tmate.sock wait tmate-ready
          
          # Get connection info
          SSH=$(tmate -S ~/.tmate.sock display -p '#{tmate_ssh}')
          WEB=$(tmate -S ~/.tmate.sock display -p '#{tmate_web}')
          
          echo "SSH: $SSH"
          echo "WEB: $WEB"
          
          # Save to environment
          echo "TMATE_SSH=$SSH" >> $GITHUB_ENV
          echo "TMATE_WEB=$WEB" >> $GITHUB_ENV
          
          echo "✅ tmate session ready"

      - name: Display connection instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║           KALI LINUX SESSION READY                  ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "📌 METHOD 1: SSH ACCESS (Recommended)"
          echo "   Command to copy:"
          echo "   $TMATE_SSH"
          echo ""
          echo "📌 METHOD 2: WEB SSH"
          echo "   Browser URL:"
          echo "   https://tmate.io/t/$TMATE_WEB"
          echo ""
          echo "📦 INSIDE THE SESSION, ACCESS KALI:"
          echo "   docker exec -it kali-runner bash"
          echo ""
          echo "🔧 KALI TOOLS AVAILABLE:"
          echo "   • nmap, netcat, socat"
          echo "   • curl, wget, git"
          echo "   • python3, pip3"
          echo "   • vim, nano, htop"
          echo ""
          echo "💡 QUICK START:"
          echo "   1. ssh $TMATE_SSH"
          echo "   2. docker exec -it kali-runner bash"
          echo "   3. Start hacking! 🎯"
          echo ""
          echo "⏰ SESSION DURATION: Up to 6 hours"
          echo "╔══════════════════════════════════════════════════════╗"

      - name: Keep session alive
        run: |
          echo "⏳ Session active for 6 hours..."
          echo "Press Ctrl+C in these logs to end early"
          echo ""
          
          # Show countdown
          for i in {1..360}; do
            if [ $((i % 60)) -eq 0 ]; then
              minutes=$((i / 60))
              echo "[$(date '+%H:%M:%S')] Active: ${minutes} minute(s)"
            fi
            sleep 1
          done
          
          echo "⏰ Time's up! Session ending..."

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          docker rm -f kali-runner 2>/dev/null || true
          rm -rf ~/.tmate 2>/dev/null || true
          echo "✅ Cleanup complete"
