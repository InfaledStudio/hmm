name: VNCon

on: 
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
      - name: Allow VNC Firewall
        run: |
          netsh advfirewall firewall add rule name="VNC" dir=in action=allow protocol=TCP localport=5900

      - name: Download UltraVNC (Reliable Link)
        run: |
          # Using a direct download link from a reliable source to avoid "index.php" issues
          $url = "https://github.com/ultravnc/ultravnc/releases/download/1.4.4.0/UltraVNC_1_4_4_0_X64_Setup.exe"
          $out = "$env:TEMP\ultravnc.exe"
          curl.exe -L -o $out $url
          
          # Verify the file size is large enough to be a real installer (> 3MB)
          if ((Get-Item $out).Length -lt 1000000) { 
            throw "Download failed: The file is too small and is likely a redirect page." 
          }

      - name: Install UltraVNC
        run: |
          $process = Start-Process "$env:TEMP\ultravnc.exe" -ArgumentList "/verysilent /inf=setup.inf" -PassThru -Wait
          if ($process.ExitCode -ne 0) { Write-Warning "Installer exited with code $($process.ExitCode)" }

      - name: Set VNC Password and Start Service
        run: |
          $vncDir = "C:\Program Files\UltraVNC"
          if (Test-Path "$vncDir\setpasswd.exe") {
              # Sets password to: r1234567
              & "$vncDir\setpasswd.exe" r1234567
              sc.exe config uvnc_service start= auto
              Start-Service uvnc_service
          } else {
              throw "UltraVNC not found at $vncDir. Installation likely failed."
          }

      - name: Install Cloudflared
        run: |
          curl.exe -L -o C:\cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Start Cloudflare Tunnel
        run: |
          Start-Process -NoNewWindow `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --url tcp://localhost:5900"

      - name: Show VNC Info
        run: |
          Write-Host "=============================="
          Write-Host " VNC READY (Cloudflare TCP)"
          Write-Host " Password: r1234567"
          Write-Host "=============================="
          Write-Host "Look for the 'trycloudflare.com' address in the logs above."

      - name: Keep Runner Alive
        run: |
          # Keeps the session active for 6 hours
          Start-Sleep -Seconds 21600
