name: VNCon

on: 
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
      - name: Allow VNC Firewall
        run: |
          netsh advfirewall firewall add rule name="VNC" dir=in action=allow protocol=TCP localport=5900

      - name: Install TightVNC (Most Reliable)
        run: |
          Write-Host "Downloading TightVNC..."
          
          # TightVNC has stable download links
          $tightvncUrl = "https://www.tightvnc.com/download/2.8.82/tightvnc-2.8.82-gpl-setup-64bit.msi"
          $installerPath = "$env:TEMP\tightvnc.msi"
          
          # Download TightVNC
          Invoke-WebRequest -Uri $tightvncUrl -OutFile $installerPath -UseBasicParsing
          
          # Verify download
          if (-not (Test-Path $installerPath)) {
            throw "Failed to download TightVNC"
          }
          
          $fileSize = (Get-Item $installerPath).Length
          Write-Host "Downloaded file size: $fileSize bytes"
          
          if ($fileSize -lt 1000000) {
            throw "Downloaded file is too small, likely failed"
          }

      - name: Install TightVNC Silently
        run: |
          Write-Host "Installing TightVNC..."
          
          $installerPath = "$env:TEMP\tightvnc.msi"
          
          # Install with MSI
          msiexec.exe /i "$installerPath" /qn /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SERVER_ALLOW_SAS=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=r1234567 SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=r1234567
          
          # Wait for installation
          Start-Sleep -Seconds 10
          
          Write-Host "TightVNC installation completed"

      - name: Start TightVNC Service
        run: |
          Write-Host "Starting TightVNC service..."
          
          # Configure and start the service
          sc.exe config "tvnserver" start= auto
          Start-Service "tvnserver"
          
          # Verify service is running
          $service = Get-Service "tvnserver" -ErrorAction SilentlyContinue
          if ($service.Status -eq "Running") {
            Write-Host "✅ TightVNC service is running"
          } else {
            Write-Host "Attempting to start TVN server manually..."
            # Try to start it manually
            Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-start" -Wait
            Start-Sleep -Seconds 3
          }
          
          # Double-check service status
          $service = Get-Service "tvnserver" -ErrorAction SilentlyContinue
          if ($service.Status -ne "Running") {
            Write-Warning "Service might need manual configuration"
            Write-Host "You can configure TightVNC by running: C:\Program Files\TightVNC\tvnserver.exe -controlapp"
          }

      - name: Install Cloudflared
        run: |
          Write-Host "Installing Cloudflared..."
          
          # Direct download from Cloudflare
          $cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/download/2024.12.0/cloudflared-windows-amd64.exe"
          
          # Use specific version instead of "latest" to avoid issues
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile "C:\cloudflared.exe" -UseBasicParsing
          
          if (Test-Path "C:\cloudflared.exe") {
            Write-Host "✅ Cloudflared downloaded successfully"
          } else {
            throw "Failed to download cloudflared"
          }

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "Starting Cloudflare tunnel for VNC (port 5900)..."
          
          # Start cloudflared in the background
          Start-Process -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --url tcp://localhost:5900" `
            -NoNewWindow `
            -RedirectStandardOutput "C:\tunnel.log" `
            -RedirectStandardError "C:\tunnel_error.log"
          
          # Give it time to start
          Start-Sleep -Seconds 5
          
          # Show initial tunnel output
          if (Test-Path "C:\tunnel.log") {
            Write-Host "--- Tunnel Log (last 5 lines) ---"
            Get-Content "C:\tunnel.log" -Tail 5 | ForEach-Object { Write-Host $_ }
          }

      - name: Show Connection Info
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "        VNC SERVER READY"
          Write-Host "========================================="
          Write-Host "VNC Server: TightVNC"
          Write-Host "Port: 5900"
          Write-Host "Password: r1234567"
          Write-Host ""
          Write-Host "Cloudflare tunnel is running..."
          Write-Host "Check the logs above for your tunnel URL"
          Write-Host "(Look for 'trycloudflare.com' address)"
          Write-Host ""
          Write-Host "Current network status:"
          netstat -an | findstr ":5900"
          Write-Host ""
          Write-Host "Service status:"
          Get-Service "tvnserver" -ErrorAction SilentlyContinue | Format-Table Name, Status -AutoSize
          Write-Host "========================================="

      - name: Keep Session Alive (6 Hours)
        run: |
          Write-Host "Session will remain active for 6 hours..."
          Write-Host "Monitoring services..."
          
          $endTime = (Get-Date).AddHours(6)
          $checkInterval = 30  # seconds
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            $minutes = [math]::Round($remaining.TotalMinutes, 1)
            
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Time remaining: ${minutes} minutes"
            
            # Check TightVNC service
            $vncService = Get-Service "tvnserver" -ErrorAction SilentlyContinue
            if ($vncService -and $vncService.Status -ne "Running") {
              Write-Host "Restarting TightVNC service..."
              Start-Service "tvnserver" -ErrorAction SilentlyContinue
            }
            
            # Check cloudflared process
            $cloudflaredProcess = Get-Process cloudflared -ErrorAction SilentlyContinue
            if (-not $cloudflaredProcess) {
              Write-Host "Restarting cloudflared tunnel..."
              Start-Process -FilePath "C:\cloudflared.exe" `
                -ArgumentList "tunnel --url tcp://localhost:5900" `
                -NoNewWindow `
                -RedirectStandardOutput "C:\tunnel.log" `
                -RedirectStandardError "C:\tunnel_error.log"
            }
            
            # Show tunnel status occasionally
            if ((Get-Date).Minute % 5 -eq 0) {
              if (Test-Path "C:\tunnel.log") {
                Write-Host "--- Recent tunnel activity ---"
                Get-Content "C:\tunnel.log" -Tail 3 | ForEach-Object { Write-Host $_ }
              }
            }
            
            Start-Sleep -Seconds $checkInterval
          }
          
          Write-Host "⏰ Session time limit reached (6 hours)"
          Write-Host "Workflow will now complete"
