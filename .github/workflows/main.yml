name: Kali VNC Simple

on:
  workflow_dispatch:
    inputs:
      cloudflare_url:
        description: 'Your Cloudflare Tunnel URL (e.g., kali.yourdomain.com)'
        required: true
        type: string

jobs:
  kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Start Kali VNC
        run: |
          docker run -d --name kali -p 6080:6080 kalilinux/kali-rolling \
            bash -c "apt update && apt install -y tightvncserver novnc && \
            mkdir -p /root/.vnc && echo 'kali123' | vncpasswd -f && \
            echo 'startxfce4 &' > /root/.vnc/xstartup && chmod +x /root/.vnc/xstartup && \
            vncserver :1 && websockify 6080 localhost:5901"
      
      - name: Show Info
        run: |
          echo "=========================================="
          echo "KALI VNC READY!"
          echo "=========================================="
          echo ""
          echo "🔐 Password: kali123"
          echo ""
          echo "🌐 Your Cloudflare URL:"
          echo "https://${{ github.event.inputs.cloudflare_url }}/vnc.html"
          echo ""
          echo "📍 Local URL:"
          echo "http://localhost:6080/vnc.html"
          echo ""
          echo "⏰ Duration: 6 hours"
          echo "=========================================="
      
      - name: Wait
        run: sleep 21600
      
      - name: Clean
        run: docker rm -f kali
