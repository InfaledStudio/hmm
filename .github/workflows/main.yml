name: Kali/SSH via tmate

on:
  workflow_dispatch:
    inputs:
      session_type:
        description: 'Session type'
        required: true
        default: 'kali'
        type: choice
        options:
          - kali
          - ubuntu
          - debug
      session_duration:
        description: 'Session duration in minutes (max 360)'
        required: false
        default: '60'

jobs:
  kali-ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    
    steps:
      - name: Setup tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          detached: true

      - name: Wait for connection
        run: |
          echo "SSH session is ready!"
          echo "=============================================="
          echo "Connect via SSH using one of these commands:"
          echo "----------------------------------------------"
          echo "SSH: ssh ${{ steps.tmate.outputs.ssh }}"
          echo ""
          echo "Web SSH: ${{ steps.tmate.outputs.web }}"
          echo "=============================================="
          echo ""
          echo "Session will auto-close after ${{ github.event.inputs.session_duration || '60' }} minutes"
          echo "Press Ctrl+C here to end session early"
          
          # Keep alive for specified duration
          sleep $(( ${{ github.event.inputs.session_duration || '60' }} * 60 ))
