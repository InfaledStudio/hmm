name: Kali VNC with Cloudflare
on: workflow_dispatch

jobs:
  kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Kali
        run: |
          docker run -d --name kali -p 6080:6080 kalilinux/kali-rolling \
            bash -c "apt update && apt install -y tightvncserver novnc && \
            mkdir -p /root/.vnc && echo 'kali123' | vncpasswd -f && \
            echo 'startxfce4 &' > /root/.vnc/xstartup && chmod +x /root/.vnc/xstartup && \
            vncserver :1 && websockify 6080 localhost:5901"
      
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
      
      - name: Setup Cloudflare
        run: |
          echo "Cloudflare setup required manually"
          echo ""
          echo "1. Your VNC is at: http://localhost:6080/vnc.html"
          echo "2. Password: kali123"
          echo ""
          echo "To setup Cloudflare:"
          echo "1. Go to Cloudflare Zero Trust"
          echo "2. Create tunnel pointing to: http://localhost:6080"
      
      - name: Show connection
        run: |
          echo "✅ Kali VNC is running!"
          echo "Local: http://localhost:6080/vnc.html"
          echo "Password: kali123"
      
      - name: Wait
        run: sleep 21600
      
      - name: Clean
        run: docker rm -f kali
