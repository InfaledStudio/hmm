name: VNCon

on: 
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
      - name: Allow VNC Firewall
        run: |
          netsh advfirewall firewall add rule name="VNC" dir=in action=allow protocol=TCP localport=5900

      - name: Download UltraVNC (Alternative Source)
        run: |
          # Using a reliable download source
          $url = "https://www.uvnc.com/downloads/ultravnc/144-downloads.html"
          # Extract the actual download link from the download page
          $downloadPage = Invoke-WebRequest -Uri $url -UseBasicParsing
          # UltraVNC direct download link (updated to a working version)
          $directUrl = "https://www.uvnc.eu/download/UltraVNC_1440_X64_setup.exe"
          $out = "$env:TEMP\ultravnc.exe"
          
          Write-Host "Downloading from: $directUrl"
          
          # Use Invoke-WebRequest with proper headers
          Invoke-WebRequest -Uri $directUrl -OutFile $out -UserAgent "Mozilla/5.0" -UseBasicParsing
          
          # Verify the file
          $fileInfo = Get-Item $out
          Write-Host "File size: $($fileInfo.Length) bytes"
          
          if ($fileInfo.Length -lt 1000000) { 
            Write-Warning "File size is small, trying alternative download..."
            # Alternative download link
            $altUrl = "https://github.com/ultravnc/UltraVNC/releases/download/1.4.4.0/UltraVNC_1_4_4_0_X64_Setup.exe"
            Invoke-WebRequest -Uri $altUrl -OutFile $out -UserAgent "Mozilla/5.0" -UseBasicParsing
          }
          
          # Final verification
          if ((Get-Item $out).Length -lt 1000000) { 
            throw "Download failed: The file is too small and is likely a redirect page." 
          }

      - name: Install UltraVNC
        run: |
          Write-Host "Installing UltraVNC..."
          # First try silent install
          $process = Start-Process "$env:TEMP\ultravnc.exe" -ArgumentList "/verysilent /suppressmsgboxes /norestart" -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
            Write-Warning "Silent install failed with code $($process.ExitCode), trying with basic flags..."
            # Try with simpler arguments
            Start-Process "$env:TEMP\ultravnc.exe" -ArgumentList "/silent" -Wait
          }
          
          # Give time for installation to complete
          Start-Sleep -Seconds 10

      - name: Set VNC Password and Start Service
        run: |
          # Check multiple possible installation locations
          $possiblePaths = @(
            "C:\Program Files\UltraVNC",
            "C:\Program Files (x86)\UltraVNC",
            "C:\Program Files\uvnc bvba\UltraVNC"
          )
          
          $vncDir = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path "$path\winvnc.exe") {
              $vncDir = $path
              break
            }
          }
          
          if ($vncDir) {
            Write-Host "Found UltraVNC at: $vncDir"
            
            # Set password using the setpasswd utility
            if (Test-Path "$vncDir\vncpwd.exe") {
              # First, stop any running VNC service
              Stop-Service uvnc_service -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              
              # Set the password (r1234567)
              & "$vncDir\vncpwd.exe" -set r1234567
            }
            else {
              # Try to find the setpasswd utility
              $setpasswdPath = Get-ChildItem -Path $vncDir -Filter "*passwd*.exe" | Select-Object -First 1
              if ($setpasswdPath) {
                & $setpasswdPath.FullName r1234567
              }
            }
            
            # Configure and start the service
            sc.exe config uvnc_service start= auto
            Start-Service uvnc_service
            
            # Verify service is running
            $service = Get-Service uvnc_service -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq "Running") {
              Write-Host "VNC service is running successfully"
            } else {
              # Try to start winvnc directly as fallback
              Start-Process -FilePath "$vncDir\winvnc.exe" -ArgumentList "-run" -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning "UltraVNC not found in standard locations. Checking for installed programs..."
            Get-WmiObject Win32_Product | Where-Object {$_.Name -like "*VNC*"} | Format-List Name, Version
            throw "UltraVNC installation not found"
          }

      - name: Install Cloudflared
        run: |
          $cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile "C:\cloudflared.exe" -UseBasicParsing
          
          # Verify download
          if (Test-Path "C:\cloudflared.exe") {
              Write-Host "Cloudflared downloaded successfully"
          } else {
              throw "Cloudflared download failed"
          }

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "Starting Cloudflare tunnel..."
          # Start cloudflared in background
          $cloudflaredArgs = "tunnel --url tcp://localhost:5900"
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList $cloudflaredArgs -NoNewWindow
          
          # Wait a moment for tunnel to initialize
          Start-Sleep -Seconds 5

      - name: Show VNC Info
        run: |
          Write-Host "=============================="
          Write-Host " VNC READY (Cloudflare TCP)"
          Write-Host " Password: r1234567"
          Write-Host "=============================="
          Write-Host "The VNC server should be available through Cloudflare tunnel"
          Write-Host "Look for the 'trycloudflare.com' address in the logs above"
          Write-Host ""
          Write-Host "Current connections:"
          netstat -an | findstr ":5900"
          Write-Host ""
          Write-Host "Services status:"
          Get-Service uvnc_service -ErrorAction SilentlyContinue | Format-List Status, Name

      - name: Keep Runner Alive
        run: |
          Write-Host "Keeping the session active for 1 hour..."
          # Keeps the session active for 1 hour (3600 seconds)
          $startTime = Get-Date
          $endTime = $startTime.AddHours(1)
          
          while ((Get-Date) -lt $endTime) {
              $timeLeft = $endTime - (Get-Date)
              Write-Host "Time remaining: $([math]::Round($timeLeft.TotalMinutes, 1)) minutes"
              
              # Check if VNC service is still running
              $service = Get-Service uvnc_service -ErrorAction SilentlyContinue
              if ($service.Status -ne "Running") {
                  Write-Warning "VNC service is not running, attempting to restart..."
                  Start-Service uvnc_service -ErrorAction SilentlyContinue
              }
              
              Start-Sleep -Seconds 60
          }
          
          Write-Host "Session time limit reached"
