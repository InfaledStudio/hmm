name: VNCon

on: 
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
      - name: Allow VNC Firewall
        run: |
          netsh advfirewall firewall add rule name="VNC" dir=in action=allow protocol=TCP localport=5900

      - name: Download UltraVNC Installer
        run: |
          $url = "https://www.uvnc.com/downloads/ultravnc/1440/UltraVNC_1_4_4_0_X64_Setup.exe"
          $out = "$env:TEMP\ultravnc.exe"
          # -L follows redirects, -o specifies the output file
          curl.exe -L -o $out $url
          if (-not (Test-Path $out)) { throw "Download failed: File not found." }

      - name: Install UltraVNC (Service Mode)
        run: |
          Start-Process "$env:TEMP\ultravnc.exe" `
            -ArgumentList "/silent", "/loadinf=setup.inf" `
            -Wait

      - name: Set VNC Password and Start Service
        run: |
          # Note: UltraVNC might require the directory to exist before setting pass
          $vncDir = "C:\Program Files\UltraVNC"
          if (Test-Path "$vncDir\setpasswd.exe") {
              & "$vncDir\setpasswd.exe" r1234567
              sc.exe config uvnc_service start= auto
              Start-Service uvnc_service
          } else {
              Write-Error "UltraVNC installation directory not found."
          }

      - name: Verify VNC is Listening
        run: |
          netstat -ano | findstr 5900

      - name: Install Cloudflared
        run: |
          curl.exe -L -o C:\cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Start Cloudflare TCP Tunnel
        run: |
          Start-Process -NoNewWindow `
            -FilePath "C:\cloudflared.exe" `
            -ArgumentList "tunnel --url tcp://localhost:5900"

      - name: Show VNC Info
        run: |
          Write-Host "=============================="
          Write-Host " VNC READY (Cloudflare TCP)"
          Write-Host " Port: 5900"
          Write-Host " Password: r1234567"
          Write-Host "=============================="
          Write-Host "Check the logs above for the 'trycloudflare.com' address."

      - name: Keep Runner Alive
        run: |
          # Sleeps for 6 hours (21600 seconds)
          Start-Sleep -Seconds 21600
