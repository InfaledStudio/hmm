name: Kali VNC with Cloudflare

on: workflow_dispatch

jobs:
  kali-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Start Kali Linux
        run: |
          echo "🚀 Starting Kali Linux container..."
          docker run -d --name kali-vnc kalilinux/kali-rolling sleep infinity
          echo "✅ Kali container started"

      - name: Install VNC in Kali
        run: |
          echo "📦 Installing VNC server..."
          docker exec kali-vnc apt-get update
          docker exec kali-vnc apt-get install -y tightvncserver novnc websockify xfce4 firefox-esr
          
          echo "🔧 Setting up VNC password..."
          docker exec kali-vnc bash -c "mkdir -p /root/.vnc && echo 'kali123' | vncpasswd -f > /root/.vnc/passwd"
          docker exec kali-vnc chmod 600 /root/.vnc/passwd
          
          echo "✅ VNC setup complete"

      - name: Start VNC Services
        run: |
          echo "🚀 Starting VNC server..."
          
          # Create xstartup script
          docker exec kali-vnc bash -c "echo '#!/bin/bash
          xrdb \$HOME/.Xresources
          startxfce4 &' > /root/.vnc/xstartup"
          docker exec kali-vnc chmod +x /root/.vnc/xstartup
          
          # Start VNC
          docker exec -d kali-vnc vncserver :1 -geometry 1280x720 -depth 24
          
          # Start noVNC
          docker exec -d kali-vnc websockify --web /usr/share/novnc/ 6080 localhost:5901
          
          echo "✅ VNC services started"
          echo "VNC Password: kali123"

      - name: Install Cloudflared
        run: |
          echo "🌐 Installing Cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          echo "✅ Cloudflared installed"

      - name: Start Cloudflare Tunnel
        run: |
          echo "🔗 Starting Cloudflare tunnel..."
          
          # Start tunnel in background
          nohup cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/cf.log &
          sleep 10
          
          # Try to get URL
          if [ -f /tmp/cf.log ]; then
            URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            if [ ! -z "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "✅ Cloudflare URL: $URL"
            else
              echo "⚠️ Could not extract URL, check logs"
            fi
          fi

      - name: Display Connection Info
        run: |
          echo ""
          echo "=========================================="
          echo "       KALI VNC READY!"
          echo "=========================================="
          echo ""
          
          if [ ! -z "$TUNNEL_URL" ]; then
            echo "🌐 WEB VNC (CLOUDFLARE):"
            echo "   URL: $TUNNEL_URL/vnc.html"
            echo "   Password: kali123"
            echo ""
          fi
          
          echo "🖥️ LOCAL VNC:"
          echo "   URL: http://localhost:6080/vnc.html"
          echo "   Password: kali123"
          echo ""
          echo "🔧 DIRECT VNC:"
          echo "   Server: localhost:5901"
          echo "   Password: kali123"
          echo ""
          echo "⏰ Duration: 6 hours"
          echo "=========================================="

      - name: Keep Alive
        run: |
          echo "✅ Session active for 6 hours..."
          echo "Access Kali VNC using the URLs above"
          sleep 21600

      - name: Cleanup
        run: |
          echo "🧹 Cleaning up..."
          docker rm -f kali-vnc
          pkill cloudflared || true
