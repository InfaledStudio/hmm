name: Kali Linux - VNC & SSH

on: workflow_dispatch

jobs:
  kali-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Setup Kali with VNC
        run: |
          echo "🚀 Starting Kali with VNC..."
          
          # Run Kali with VNC server
          docker run -d \
            --name kali-vnc \
            -p 5901:5901 \
            -p 6080:6080 \
            kalilinux/kali-rolling \
            /bin/bash -c "
              apt-get update && apt-get install -y \
                kali-linux-core \
                tightvncserver \
                novnc \
                websockify \
                xfce4 xfce4-goodies \
                firefox-esr \
                curl wget git \
              && mkdir -p /root/.vnc \
              && echo 'kali123' | vncpasswd -f > /root/.vnc/passwd \
              && chmod 600 /root/.vnc/passwd \
              && echo '#!/bin/bash\nstartxfce4' > /root/.vnc/xstartup \
              && chmod +x /root/.vnc/xstartup \
              && vncserver :1 -geometry 1280x800 -depth 24 \
              && websockify --web /usr/share/novnc/ 6080 localhost:5901 \
              && sleep infinity
            "
          
          echo "✅ Kali VNC running"
          echo "VNC Port: 5901"
          echo "Web VNC: 6080"
          echo "Password: kali123"

      - name: Install tmate
        run: |
          echo "🔗 Setting up tmate..."
          wget -q https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz
          tar -xf tmate-2.4.0-static-linux-amd64.tar.xz
          sudo mv tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/
          
          mkdir -p ~/.tmate
          ssh-keygen -t rsa -f ~/.tmate/tmate_key -q -N ""
          
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          
          echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
          echo "WEB_URL=$WEB_URL" >> $GITHUB_ENV
          
          echo "✅ tmate ready"

      - name: Show connection info
        run: |
          echo ""
          echo "================================================="
          echo "          KALI VNC DESKTOP READY"
          echo "================================================="
          echo ""
          echo "🖥️  WEB VNC DESKTOP:"
          echo "   URL: http://localhost:6080/vnc.html"
          echo "   Password: kali123"
          echo ""
          echo "🔌 DIRECT VNC CLIENT:"
          echo "   Server: localhost:5901"
          echo "   Password: kali123"
          echo ""
          echo "🔗 SSH ACCESS:"
          echo "   Command: $SSH_CMD"
          echo "   Web SSH: https://tmate.io/t/$WEB_URL"
          echo ""
          echo "⚡ Inside SSH, access Kali:"
          echo "   docker exec -it kali-vnc bash"
          echo ""
          echo "⏰ Session: 6 hours"
          echo "================================================="

      - name: Keep alive
        run: |
          echo "🟢 Session active for 6 hours..."
          sleep 21600

      - name: Cleanup
        if: always()
        run: |
          docker rm -f kali-vnc
